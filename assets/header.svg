<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Mohammed Al-Salahi — QA Engineer, WordPress Developer, Content Manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#f778ba"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="360" rx="18"/></clipPath>
    <clipPath id="typeclip"><rect x="0" y="0" width="0" height="30"><animate attributeName="width" from="0" to="330" begin="0.4s" dur="1.6s" fill="freeze" calcMode="discrete" values="0;30;60;90;120;150;180;210;240;270;300;330" keyTimes="0;0.09;0.18;0.27;0.36;0.45;0.54;0.63;0.72;0.81;0.9;1"/></rect></clipPath>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
    .sans{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
    .ln{opacity:0;animation:in .35s ease-out forwards}
    @keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
    .l1{animation-delay:2.2s}.l2{animation-delay:2.7s}.l3{animation-delay:3.1s}.l4{animation-delay:3.5s}.l5{animation-delay:3.9s}.l6{animation-delay:4.5s}.l7{animation-delay:5s}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .float{animation:float 6s ease-in-out infinite}
    @keyframes float{50%{transform:translateY(-8px)}}
    .fade{opacity:0;animation:in .8s ease-out forwards}
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="360" fill="url(#bg)"/>
    <rect width="1000" height="360" fill="url(#grid)"/>
    <circle cx="120" cy="60" r="220" fill="url(#glow1)" class="float"/>
    <circle cx="900" cy="330" r="240" fill="url(#glow2)" class="float" style="animation-delay:-3s"/>

    <!-- Left: identity -->
    <g class="fade" style="animation-delay:.1s">
      <text x="48" y="92" class="mono" font-size="14" fill="#7d8590" letter-spacing="3">// HELLO, WORLD. I'M</text>
      <text x="46" y="148" class="sans" font-size="50" font-weight="800" fill="url(#name)">Mohammed</text>
      <text x="46" y="202" class="sans" font-size="50" font-weight="800" fill="url(#name)">Al-Salahi</text>
    </g>
    <g class="fade" style="animation-delay:.6s">
      <rect x="48" y="226" width="124" height="28" rx="14" fill="#1f6feb" fill-opacity=".15" stroke="#1f6feb" stroke-opacity=".6"/>
      <text x="110" y="245" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#79c0ff">🐞 QA Engineer</text>
      <rect x="182" y="226" width="136" height="28" rx="14" fill="#a371f7" fill-opacity=".15" stroke="#a371f7" stroke-opacity=".6"/>
      <text x="250" y="245" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#d2a8ff">⚡ WordPress Dev</text>
      <rect x="328" y="226" width="124" height="28" rx="14" fill="#f778ba" fill-opacity=".15" stroke="#f778ba" stroke-opacity=".6"/>
      <text x="390" y="245" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#ff9bce">✍️ Content &amp; SEO</text>
    </g>
    <text x="48" y="296" class="sans fade" style="animation-delay:1s" font-size="16" fill="#c9d1d9">I find the bugs before your users do —</text>
    <text x="48" y="320" class="sans fade" style="animation-delay:1.2s" font-size="16" fill="#c9d1d9">and build WordPress sites that don't have any.</text>

    <!-- Right: terminal -->
    <g transform="translate(500 40)">
      <rect width="456" height="282" rx="12" fill="#010409" fill-opacity=".85" stroke="#30363d"/>
      <rect width="456" height="34" rx="12" fill="#161b22"/>
      <rect y="22" width="456" height="12" fill="#161b22"/>
      <circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
      <text x="228" y="22" text-anchor="middle" class="mono" font-size="12" fill="#7d8590">mohammed@qa: ~/profile</text>

      <g class="mono" font-size="14">
        <g transform="translate(20 52)">
          <g clip-path="url(#typeclip)"><text y="20"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> npm test -- profile.spec.ts</tspan></text></g>
        </g>
        <g class="ln l1"><rect x="20" y="89" width="52" height="20" rx="3" fill="#3fb950"/><text x="46" y="104" text-anchor="middle" fill="#0d1117" font-weight="700">PASS</text><text x="82" y="104" fill="#e6edf3">profile.spec.ts</text></g>
        <text x="36" y="134" class="ln l2"><tspan fill="#3fb950">✓</tspan><tspan fill="#c9d1d9"> tests software like a pro</tspan><tspan fill="#7d8590"> (3y)</tspan></text>
        <text x="36" y="160" class="ln l3"><tspan fill="#3fb950">✓</tspan><tspan fill="#c9d1d9"> ships fast WordPress sites</tspan><tspan fill="#7d8590"> (3y)</tspan></text>
        <text x="36" y="186" class="ln l4"><tspan fill="#3fb950">✓</tspan><tspan fill="#c9d1d9"> writes content that ranks</tspan><tspan fill="#7d8590"> (2y)</tspan></text>
        <text x="36" y="212" class="ln l5"><tspan fill="#3fb950">✓</tspan><tspan fill="#c9d1d9"> catches bugs before prod</tspan><tspan fill="#7d8590"> (∞)</tspan></text>
        <text x="20" y="244" class="ln l6"><tspan fill="#e6edf3" font-weight="700">Tests:</tspan><tspan fill="#3fb950" font-weight="700"> 4 passed</tspan><tspan fill="#7d8590">, 4 total · 0 bugs</tspan></text>
        <text x="20" y="268" class="ln l7"><tspan fill="#3fb950">$</tspan><tspan fill="#a371f7"> status</tspan><tspan fill="#e6edf3"> → open to work </tspan><tspan class="cur" fill="#58a6ff">▋</tspan></text>
      </g>
    </g>
  </g>
</svg>
